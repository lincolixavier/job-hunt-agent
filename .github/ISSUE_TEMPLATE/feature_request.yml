name: Feature request
description: Suggest a CLI command, workflow or doc improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What went wrong or took too long in your search?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [CLI, Workflows / AGENTS.md, Docs, Other agents support, Other]
    validations:
      required: true
