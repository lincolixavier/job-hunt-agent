[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jobhunt"
version = "0.1.0"
description = "An AI-agent workspace for running a focused, honest job search: screen postings, tailor one-page CVs, apply, and track everything."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "job-hunt-agent contributors" }]
keywords = ["job-search", "ai-agents", "claude-code", "cv", "resume", "agents-md"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Office/Business",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.17.5"]

[project.scripts]
jobhunt = "jobhunt.cli:main"

[project.urls]
Documentation = "https://github.com/lincolixavier/job-hunt-agent/tree/main/docs"
Issues = "https://github.com/lincolixavier/job-hunt-agent/issues"
Changelog = "https://github.com/lincolixavier/job-hunt-agent/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jobhunt = ["templates/*", "scaffold/*", "scaffold/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]
